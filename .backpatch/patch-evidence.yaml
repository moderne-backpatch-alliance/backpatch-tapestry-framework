schema: osera-patch-evidence/0.1.0
producer: moderne
release: 4.1.6.1-backpatch-00001
baseline: v4.1.6+backpatch.baseline
fixes:
  - cve: CVE-2020-17531
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2020-17531
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-tapestry-framework/commit/6d8b908
    basis: original
    artifacts:
      - org.apache.tapestry:tapestry-framework
    note: "New in this release; ported onto 4.1.6; fixed at 4.1.6.1-backpatch-00001 (backpatch-tapestry-framework@6d8b908). Tapestry now signs every serialized Java object it puts into a request (the `sp` parameter of external pages, hidden form values, and client-persisted page state in `state:` and `appstate:`) with HMAC-SHA256, and refuses a value whose signature does not match before decoding it (CVE-2020-17531). If your application puts objects into links, forms or client state, a value issued before the upgrade or by another JVM now shows the Exception page and logs one warning naming the CVE: a bookmarked external-page link, a form left open across a restart, or a request that reaches another node without sticky sessions. On Java 1.4, which has no HmacSHA256, a page that puts such a value into a link, form or client state fails. To keep values valid across restarts and nodes, set the system property `org.apache.tapestry.squeeze-signing-key` to the same secret on every node."
